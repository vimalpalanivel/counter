<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hue: 250;
    --bg-1: hsl(var(--hue), 45%, 12%);
    --bg-2: hsl(calc(var(--hue) + 40), 55%, 18%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    background: radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1) 70%);
    transition: background 0.5s ease;
    overflow: hidden;
  }

  /* slow drifting glow, purely ambient, not attention-grabbing */
  body::before {
    content: "";
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    background: radial-gradient(circle, hsla(var(--hue), 80%, 60%, 0.18), transparent 70%);
    animation: drift 18s ease-in-out infinite;
    filter: blur(10px);
  }

  @keyframes drift {
    0%, 100% { transform: translate(-10%, -10%); }
    50% { transform: translate(10%, 10%); }
  }

  .stage {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .label {
    color: hsla(var(--hue), 60%, 80%, 0.6);
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .count-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 40px;
  }

  #count {
    font-size: 120px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    display: inline-block;
    transition: color 0.4s ease;
  }

  #count.pop {
    animation: pop 0.28s ease;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* expanding ring that fires on every click, colored by action */
  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
    border-radius: 50%;
    border: 2px solid currentColor;
    opacity: 0.9;
    pointer-events: none;
    animation: ring-out 0.6s ease-out forwards;
  }

  @keyframes ring-out {
    to {
      width: 260px;
      height: 260px;
      margin: -130px 0 0 -130px;
      opacity: 0;
    }
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  button {
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 22px;
    font-weight: 500;
    width: 64px;
    height: 58px;
    cursor: pointer;
    color: #fff;
    backdrop-filter: blur(6px);
    transition: transform 0.12s ease, filter 0.2s ease;
  }

  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(0.9); }

  #increment { background: hsla(140, 60%, 45%, 0.85); }
  #decrement { background: hsla(6, 70%, 55%, 0.85); }

  #reset {
    background: hsla(0, 0%, 100%, 0.08);
    border: 1px solid hsla(0, 0%, 100%, 0.2);
    width: 100%;
    height: 44px;
    margin-top: 14px;
    font-size: 14px;
    letter-spacing: 1px;
    border-radius: 12px;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="label">COUNT</div>
    <div class="count-wrap" id="countWrap">
      <div id="count">0</div>
    </div>
    <div class="buttons">
      <button id="decrement">−</button>
      <button id="increment">+</button>
    </div>
    <button id="reset">RESET</button>
  </div>

  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    const wrap = document.getElementById('countWrap');
    const root = document.documentElement;

    function updateDisplay(ringColor) {
      countEl.textContent = count;

      // background hue drifts with the count — living, reactive backdrop
      const hue = (250 + count * 8) % 360;
      root.style.setProperty('--hue', hue < 0 ? hue + 360 : hue);

      // pop animation on the number
      countEl.classList.remove('pop');
      void countEl.offsetWidth; // restart animation
      countEl.classList.add('pop');

      // expanding ring pulse colored by the action
      const ring = document.createElement('div');
      ring.className = 'ring';
      ring.style.color = ringColor;
      wrap.appendChild(ring);
      ring.addEventListener('animationend', () => ring.remove());
    }

    document.getElementById('increment').addEventListener('click', () => {
      count++;
      updateDisplay('#4caf50');
    });

    document.getElementById('decrement').addEventListener('click', () => {
      count--;
      updateDisplay('#f44336');
    });

    document.getElementById('reset').addEventListener('click', () => {
      count = 0;
      updateDisplay('#bbbbbb');
    });
    <h1>KAMESH DON</h1>
    // keyboard support: ↑/+ to increment, ↓/- to decrement, r to reset
    window.addEventListener('keydown', (e) => {
      if (e.key === '+' || e.key === 'ArrowUp') document.getElementById('increment').click();
      if (e.key === '-' || e.key === 'ArrowDown') document.getElementById('decrement').click();
      if (e.key.toLowerCase() === 'r') document.getElementById('reset').click();
    });
  </script>

</body>
</html>
